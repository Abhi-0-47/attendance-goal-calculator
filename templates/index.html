<!DOCTYPE html>
<html>
<head>
    <title>Attendance Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; }
        h2 { color: #2c3e50; text-align: center; }
        label { display: block; margin: 10px 0 5px; color: #7f8c8d; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-left: 5px solid #3498db; color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📊 Attendance Goal</h2>
        <form method="POST">
            <label>Classes Attended</label>
            <input type="number" name="attended" required>
            <label>Total Classes Conducted</label>
            <input type="number" name="total" required>
            <label>Target Percentage (e.g., 75)</label>
            <input type="number" name="target" value="75" required>
            <button type="submit">Calculate Status</button>
        </form>
        {% if result %}
        <div class="result">{{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
